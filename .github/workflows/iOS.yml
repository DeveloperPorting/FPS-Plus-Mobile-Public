name: iOS Build

on: workflow_dispatch

jobs:
  build:
    name: iOS Build
    permissions: write-all
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Install Libraries
        run: |
         haxelib install hmm --quiet
         haxelib run hmm setup
         haxelib run hmm install
         haxelib --global install hxvlc
         remove lime
         haxelib git lime https://github.com/th2l-devs/lime
         haxelib run lime rebuild hxcpp

      - name: Compile
        run: haxelib run lime build ios -clean -nosign

      - name: Making ipa file
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/FunkinFPSPlus.app
          ldid -S../../../FunkinFPSPlus/FunkinFPSPlus.entitlements FunkinFPSPlus
          cd ..
          mkdir Payload
          mv FunkinFPSPlus.app Payload
          zip -r FunkinFPSPlus.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: FPS Plus iOS
          path: export/release/ios/build/Release-iphoneos/*.ipa
          if-no-files-found: error
